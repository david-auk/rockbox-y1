# crow itup

# =============================================================================
# LIST & NAVIGATION
# =============================================================================

selector type: bar (inverse)
scrollbar: off
scrollbar width: 8
list separator color: 848284
show icons: yes


# =============================================================================
# STATUS & INDICATORS
# =============================================================================

statusbar: off
volume display: graphic
battery display: numeric


# =============================================================================
# COLORS
# =============================================================================

foreground color: 000429
background color: d68284

line selector start color: 00007b
line selector end color: 2961de
line selector text color: ffffff

filetype colours: -


# =============================================================================
# FONT
# =============================================================================

font: /.rockbox/fonts/14-LanaPixel.fnt


# =============================================================================
# ICONS
# =============================================================================

iconset: /.rockbox/icons/modone.bmp
viewers iconset: /.rockbox/icons/modone_viewer.bmp


# =============================================================================
# THEME SCREENS
# =============================================================================

wps: /.rockbox/wps/crowPod.wps
sbs: /.rockbox/wps/crowPod.sbs


# =============================================================================
# BACKDROP & VIEWPORT
# =============================================================================

backdrop: -
ui viewport: -
